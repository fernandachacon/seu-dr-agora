<header class="topbar">
    <div class="topbar-container">
        <div class="left">
            <img
                ngSrc="/images/LOGO_AREAPACIENTE.png"
                alt="Logo"
                width="50"
                height="50"
                class="logo"
                routerLink="/"
            />
        </div>
        
        <button class="menu-toggle" (click)="menuAberto = !menuAberto">
            ☰
        </button>

        <nav class="menu" [class.aberto]="menuAberto">
            <span routerLink="/area-paciente" 
            routerLinkActive="ativo" 
            [routerLinkActiveOptions]="{ exact: true }" 
            (click)="fecharMenu()">
            Painel
            </span>
            <span routerLink="/area-paciente" 
            routerLinkActive="ativo"  
            (click)="fecharMenu()">
            Prontuário
            </span>
        </nav>

       <div class="usuario" *ngIf="perfil">
            <span class="nome">{{ perfil.nome }}</span>
            <div class="avatar"></div>

            <div class="logout">
                <a routerLink="/login">
                <img src="/images/logout.png" alt="Sair">
                </a>
            </div>
        </div>
    </div>
</header>


<main class="conteudo">
    <router-outlet />
</main>

<app-footer />
