<header class="header">
  <div class="header-container">

    <div class="left">
      <img
                ngSrc="/images/LOGO_HEADER.png"
                alt="Logo"
                width="50"
                height="50"
                class="logo"
            />
    </div>

    <!-- Botão hamburguer (só mobile) -->
    <button class="menu-toggle" (click)="menuAberto = !menuAberto">
      ☰
    </button>

    <nav class="menu" [class.aberto]="menuAberto">
      <a href="#inicio" (click)="fecharMenu()">INÍCIO</a>
      <a href="#areas" (click)="fecharMenu()">ÁREAS DE ATUAÇÃO</a>
      <a href="#como-agendar" (click)="fecharMenu()">COMO AGENDAR</a>
      <a href="#diferenciais" (click)="fecharMenu()">DIFERENCIAIS</a>
      <a href="#duvidas" (click)="fecharMenu()">DÚVIDAS</a>
    </nav>

    <section class="cta-section desktop-only">
      <btn-primary
        btn-text="MARCAR CONSULTA"
        (click)="irParaCadastro()">
      </btn-primary>
    </section>

  </div>
</header>
