<app-header></app-header>
<main class="login-main">
    <div class="page-container">
        <div class="content-container">
            <h1>Já possuo uma conta</h1>
            <p>Acesse agora sua conta para agendar consultas, acompanhar agendamentos e muito mais.</p>
            
            <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-box">

                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" formControlName="email" />

                    @if (loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')) {
                    <small>
                        E-mail inválido
                    </small>
                    }
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" formControlName="senha" />
                </div>

                <button class="btn-entrar" type="submit" [disabled]="loading">
                    {{ loading ? 'Entrando...' : 'Entrar' }}
                </button>

                <p class="footer-text">
                    Ainda não possui uma conta? <a>Criar conta</a>
                </p>

                @if (errorMessage) {
                    <p style="color:red; text-align:center;">
                    {{ errorMessage }}
                    </p>
                }
            </form>
        </div>
    </div>
</main>
<app-footer></app-footer>
