<app-header></app-header>
<main>
<div class="page-container">
    <div class="content-container">
        <div class="topo">
            <button class="btn-voltar" (click)="voltar()">
                Voltar
            </button>
            <h1>Crie sua conta</h1>
            <button class="btn-login" (click)="login()">
                Já tenho conta
            </button>
        </div>
    <form [formGroup]="form" (ngSubmit)="submit()">
        <h3>Informações Pessoais</h3>
        <div class="form-group">
            <label>Nome completo*</label>
            <input type="text" formControlName="nome" />
            <small *ngIf="form.get('nome')?.touched && form.get('nome')?.hasError('required')">
                Nome é obrigatório
            </small>
        </div>
        <div class="form-group">
            <label for="cpf">CPF*</label>
            <input type="text" id="cpf" maxlength="14" placeholder="Ex: 123.456.789-00" />
        </div>
        <div class="form-group">
            <label>Celular*</label>
            <input type="tel" placeholder="(00) 90000-0000" />
        </div>
        <div class="form-group">    
            <label>Gênero*</label>
                <div class="radio-group">
                    <label><input type="radio" name="genero" /> Feminino</label> <br>
                    <label><input type="radio" name="genero" /> Masculino</label> <br>
                    <label><input type="radio" name="genero" /> Não-binário (ou outra identidade) </label> <br>
                    <label><input type="radio" name="genero" /> Prefiro não responder </label>
                </div>
        </div>
        <div class="form-group">
            <label>Data de nascimento*</label>
            <input type="date" />
        </div>
        <div class="form-group"> 
            <label for="cep">CEP*</label>
            <input type="text" id="cep" maxlength="9" placeholder="Ex: 12345-789" />
        </div> 
        <div class="form-group"> 
            <label for="endereco">Endereço*</label>
            <input type="text" id="endereco" />
        </div> 
        <div class="form-group"> 
            <label for="endereco-numero">Número*</label>
            <input type="text" id="endereco-numero" />
        </div> 
        <div class="form-group"> 
            <label for="endereco-complemento">Complemento*</label>
            <input type="text" id="endereco-complemento" />
        </div> 
        <div class="form-group"> 
            <label for="endereco-bairro">Bairro*</label>
            <input type="text" id="endereco-bairro" />
        </div> 
        <div class="form-group"> 
            <label for="endereco-cidade">Cidade*</label>
            <input type="text" id="endereco-cidade" />
        </div> 
        <div class="form-group"> 
            <label for="endereco-estado">Estado*</label>
            <input type="text" id="endereco-estado" />
        </div> 
        <h3>Dados da conta</h3>
        <div class="form-group">
            <label>E-mail*</label>
            <input type="email" formControlName="email" />
            <small *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">
                E-mail inválido
            </small>
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" formControlName="senha" />
        </div>

        <div class="form-group">
            <label>Confirme sua senha*</label>
            <input type="password" />
        </div>    

        <div class="checkbox-section">
            <input type="checkbox" id="checkbox-termos" />
            <label class= "checkbox-termos" for="checkbox-termos"> Li e concordo com os<a href="/#/terms" target="_blank"> Termos e Condições de Uso da Plataforma de Saúde</a>
            </label>
        </div>
        <button type="submit" class="btn-cadastrar">Cadastrar</button>
        <p class="footer-text"> Já possui uma conta? <a>Entrar</a> </p>
    </form>
    </div>
    <!-- BANNER -->
    <div class="image-container">
        <img
            ngSrc="/images/plataforma-segura.png"
            width="840"
            height="1150"
            alt="Plataforma segura"
        />
    </div>
</div>
</main>
<app-footer></app-footer>
