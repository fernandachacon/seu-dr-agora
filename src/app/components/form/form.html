<app-header></app-header>
<main>
<div class="page-container">
    <div class="content-container">
        <div class="topo">
            <button class="btn-voltar" (click)="voltar()">
                Voltar
            </button>
            <h1>Crie sua conta</h1>
            <button class="btn-login" (click)="login()">
                Já tenho conta
            </button>
        </div>
    <form [formGroup]="form" (ngSubmit)="submit()">
        <h3>Informações Pessoais</h3>
        <div class="form-group">
            <label for="nome">Nome completo*</label>
            <input type="text" id="nome" formControlName="nome" />
            <small *ngIf="form.get('nome')?.touched && form.get('nome')?.hasError('required')">
                Nome é obrigatório
            </small>
        </div>
        <div class="form-group">
            <label for="cpf">CPF*</label>
            <input type="text" id="cpf" formControlName="cpf" maxlength="14" placeholder="Ex: 123.456.789-00" />
            <small *ngIf="form.get('nome')?.touched && form.get('nome')?.hasError('required')">
                CPF é obrigatório
            </small>
        </div>
        <div class="form-group">
            <label for="celular">Celular*</label>
            <input type="tel" id="celular" formControlName="celular" placeholder="(00) 90000-0000" />
            <small *ngIf="form.get('nome')?.touched && form.get('nome')?.hasError('required')">
                Celular é obrigatório
            </small>
        </div>
        <div class="form-group">    
            <label for="genero">Gênero*</label>
                <div class="radio-group">
                    <label>
                    <input type="radio" formControlName="genero" value="FEMININO" /> Feminino
                    </label>
                    <label>
                    <input type="radio" formControlName="genero" value="MASCULINO" /> Masculino
                    </label>
                    <label>
                    <input type="radio" formControlName="genero" value="NAO_BINARIO" /> Não-binário
                    </label>
                    <label>
                    <input type="radio" formControlName="genero" value="NAO_RESPONDER" /> Prefiro não responder
                    </label>
                </div>
        </div>
        <div class="form-group">
            <label for="data-nascimento">Data de nascimento*</label>
            <input type="date" id="data-nascimento" formControlName="data"/>
        </div>
        <div class="form-group"> 
            <label for="cep" >CEP*</label>
            <input type="text" id="cep" maxlength="9" placeholder="Ex: 12345-789" formControlName="cep"/>
        </div> 
        <div class="form-group"> 
            <label for="rua">Endereço*</label>
            <input type="text" id="rua" formControlName="rua"/>
        </div> 
        <div class="form-group"> 
            <label for="numero">Número*</label>
            <input type="text" id="numero" formControlName="numero"/>
        </div> 
        <div class="form-group"> 
            <label for="complemento">Complemento*</label>
            <input type="text" id="complemento" formControlName="complemento"/>
        </div> 
        <div class="form-group"> 
            <label for="bairro">Bairro*</label>
            <input type="text" id="bairro" formControlName="bairro"/>
        </div> 
        <div class="form-group"> 
            <label for="cidade">Cidade*</label>
            <input type="text" id="cidade" formControlName="cidade"/>
        </div> 
        <div class="form-group"> 
            <label for="estado">Estado*</label>
            <input type="text" id="estado" formControlName="estado"/>
        </div> 
        <h3>Dados da conta</h3>
        <div class="form-group">
            <label for="email">E-mail*</label>
            <input type="email" id="email" formControlName="email" />
            <small *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">
                E-mail inválido
            </small>
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" formControlName="senha" />
        </div>

        <div class="form-group">
            <label for="confirmar-senha">Confirme sua senha*</label>
            <input type="password" id="confirmar-senha" formControlName="confirmarSenha"/>
        </div>    

        <div class="checkbox-section">
            <input type="checkbox" id="checkbox-termos" formControlName="termos" />
            <label class= "checkbox-termos" for="checkbox-termos"> Li e concordo com os<a href="/#/terms" target="_blank"> Termos e Condições de Uso da Plataforma de Saúde</a>
            </label>
        </div>
        <button type="submit" class="btn-cadastrar">Cadastrar</button>
        <p class="footer-text"> Já possui uma conta? <a>Entrar</a> </p>
    </form>
    </div>
    <!-- BANNER -->
    <div class="image-container">
        <img
            ngSrc="/images/plataforma-segura.png"
            width="840"
            height="1150"
            alt="Plataforma segura"
        />
    </div>
</div>
</main>
<app-footer></app-footer>
